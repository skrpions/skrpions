<title>Banca Digital: aplicaciones Angular para onboarding de clientes, gestión de cuentas de ahorro y banca en línea de varios bancos. Micro-frontends con Nx y Module Federation, Angular con Signals, estado con NgRx, inicio de sesión único, validación con OTP y datos cifrados, integración con APIs REST, despliegue con GitHub Actions y pruebas con Jest y Vitest.</title>
<style>
