<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 118" width="1200" height="118" role="img" aria-label="06 Formación — Formación y credenciales.">
<title>06 Formación — Formación y credenciales.</title>
<style>
text{text-rendering:geometricPrecision;font-kerning:normal}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.55)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:none}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes ch{from{opacity:0}to{opacity:1}}
.rise{animation:rise 1.2s cubic-bezier(.16,1,.3,1) both}
.fade{animation:fade 1.3s ease both}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .8s cubic-bezier(.34,1.56,.64,1) both}
.grow{transform-box:fill-box;transform-origin:0 50%;animation:grow 1.6s cubic-bezier(.65,0,.35,1) both}
.draw{stroke-dasharray:1 3;animation:draw 2.2s cubic-bezier(.65,0,.35,1) both}
.c{animation:ch .01s both}
.solid{opacity:0}
@media (prefers-color-scheme:light){.solid{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
<linearGradient id="cardSolid" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0C1E2B"/><stop offset=".55" stop-color="#09141B"/><stop offset="1" stop-color="#050D12"/></linearGradient>
<linearGradient id="cardBase" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#09161F" stop-opacity=".70"/><stop offset="1" stop-color="#050D12" stop-opacity=".58"/></linearGradient>
<linearGradient id="edge" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6EAAD4" stop-opacity=".62"/><stop offset=".45" stop-color="#6EAAD4" stop-opacity=".24"/><stop offset="1" stop-color="#6EAAD4" stop-opacity=".07"/></linearGradient>
<linearGradient id="tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6EAAD4" stop-opacity=".115"/><stop offset="1" stop-color="#6EAAD4" stop-opacity=".02"/></linearGradient>
<linearGradient id="tileEdge" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6EAAD4" stop-opacity=".40"/><stop offset="1" stop-color="#6EAAD4" stop-opacity=".12"/></linearGradient>
<linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#050D12" stop-opacity=".62"/><stop offset="1" stop-color="#050D12" stop-opacity=".26"/></linearGradient>
<linearGradient id="line" x1="0" x2="1"><stop offset="0" stop-color="#6EAAD4" stop-opacity=".95"/><stop offset=".6" stop-color="#0E84D8" stop-opacity=".4"/><stop offset="1" stop-color="#0E84D8" stop-opacity="0"/></linearGradient>
