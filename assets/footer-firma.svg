.draw{stroke-dasharray:1 3;animation:draw 2.2s cubic-bezier(.65,0,.35,1) both}
.c{animation:ch .01s both}
.solid{opacity:0}
@media (prefers-color-scheme:light){.solid{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.sigline{opacity:0;stroke-dasharray:1100;animation:sigw 4.2s ease both}@keyframes sigw{0%{stroke-dashoffset:1100;opacity:1}62%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}</style>
