<title>Skills Inventory: aplicación web que mantiene un registro actualizado del personal y sus habilidades, gestiona hojas de vida, perfiles, competencias, seguimiento de formación y certificaciones, e informes personalizados.</title>
<style>
text{text-rendering:geometricPrecision;font-kerning:normal}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.55)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:none}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes ch{from{opacity:0}to{opacity:1}}
.rise{animation:rise 1.2s cubic-bezier(.16,1,.3,1) both}
.fade{animation:fade 1.3s ease both}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .8s cubic-bezier(.34,1.56,.64,1) both}
.grow{transform-box:fill-box;transform-origin:0 50%;animation:grow 1.6s cubic-bezier(.65,0,.35,1) both}
.draw{stroke-dasharray:1;animation:draw 2.2s cubic-bezier(.65,0,.35,1) both}
.c{animation:ch .01s both}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.smil{display:none}}
</style>
