.draw{stroke-dasharray:1 3;animation:draw 2.2s cubic-bezier(.65,0,.35,1) both}
.c{animation:ch .01s both}
.solid{opacity:0}
@media (prefers-color-scheme:light){.solid{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
