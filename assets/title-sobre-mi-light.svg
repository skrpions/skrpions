<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 118" width="1200" height="118" role="img" aria-label="01 Sobre mí — Hola, soy Nestor.">
<title>01 Sobre mí — Hola, soy Nestor.</title>
<style>
text{text-rendering:geometricPrecision;font-kerning:normal}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.55)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:none}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes ch{from{opacity:0}to{opacity:1}}
.rise{animation:rise 1.2s cubic-bezier(.16,1,.3,1) both}
.fade{animation:fade 1.3s ease both}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .8s cubic-bezier(.34,1.56,.64,1) both}
.grow{transform-box:fill-box;transform-origin:0 50%;animation:grow 1.6s cubic-bezier(.65,0,.35,1) both}
.draw{stroke-dasharray:1;animation:draw 2.2s cubic-bezier(.65,0,.35,1) both}
.c{animation:ch .01s both}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.smil{display:none}}
</style>
<defs>
<linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b2d40"/><stop offset=".55" stop-color="#071a25"/><stop offset="1" stop-color="#050f16"/></linearGradient>
<radialGradient id="glowTR" cx="1" cy="0" r=".95"><stop offset="0" stop-color="#0772a3" stop-opacity=".45"/><stop offset="1" stop-color="#0772a3" stop-opacity="0"/></radialGradient>
<radialGradient id="glowBL" cx="0" cy="1" r=".75"><stop offset="0" stop-color="#0772a3" stop-opacity=".24"/><stop offset="1" stop-color="#0772a3" stop-opacity="0"/></radialGradient>
<linearGradient id="line" x1="0" x2="1"><stop offset="0" stop-color="#4fb0dc" stop-opacity=".95"/><stop offset=".6" stop-color="#0772a3" stop-opacity=".4"/><stop offset="1" stop-color="#0772a3" stop-opacity="0"/></linearGradient>
<linearGradient id="txtGrad" x1="0" x2="1"><stop offset="0" stop-color="#d9f1fb"/><stop offset="1" stop-color="#4fb0dc"/></linearGradient>
<linearGradient id="bar" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#0a4a6b"/><stop offset="1" stop-color="#4fb0dc"/></linearGradient>
<linearGradient id="barH" x1="0" x2="1"><stop offset="0" stop-color="#0772a3"/><stop offset="1" stop-color="#a8dcf2"/></linearGradient>
<linearGradient id="glint" x1="0" x2="1"><stop offset="0" stop-color="#cfefff" stop-opacity="0"/><stop offset=".38" stop-color="#d9f2ff" stop-opacity=".05"/><stop offset=".5" stop-color="#f2fbff" stop-opacity=".2"/><stop offset=".62" stop-color="#d9f2ff" stop-opacity=".05"/><stop offset="1" stop-color="#cfefff" stop-opacity="0"/></linearGradient>
<linearGradient id="glintS" x1="0" x2="1"><stop offset="0" stop-color="#cfefff" stop-opacity="0"/><stop offset=".4" stop-color="#d9f2ff" stop-opacity=".03"/><stop offset=".5" stop-color="#f2fbff" stop-opacity=".11"/><stop offset=".6" stop-color="#d9f2ff" stop-opacity=".03"/><stop offset="1" stop-color="#cfefff" stop-opacity="0"/></linearGradient>
<pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#4fb0dc" stroke-opacity=".06"/></pattern>
<linearGradient id="tsh" gradientUnits="userSpaceOnUse" x1="-300" y1="20" x2="-140" y2="70"><stop offset="0" stop-color="#8fd6f5" stop-opacity="0"/><stop offset=".5" stop-color="#8fd6f5" stop-opacity="0.9"/><stop offset="1" stop-color="#8fd6f5" stop-opacity="0"/><animateTransform attributeName="gradientTransform" type="translate" values="0 0;1300 0;1300 0" keyTimes="0;.4;1" dur="8.0s" begin="2.8s" repeatCount="indefinite"/></linearGradient><linearGradient id="tsh2" gradientUnits="userSpaceOnUse" x1="-300" y1="20" x2="-140" y2="70"><stop offset="0" stop-color="#dff3ff" stop-opacity="0"/><stop offset=".5" stop-color="#dff3ff" stop-opacity="0.9"/><stop offset="1" stop-color="#dff3ff" stop-opacity="0"/><animateTransform attributeName="gradientTransform" type="translate" values="0 0;1300 0;1300 0" keyTimes="0;.4;1" dur="8.0s" begin="2.8s" repeatCount="indefinite"/></linearGradient><linearGradient id="lsh" gradientUnits="userSpaceOnUse" x1="-240" y1="0" x2="-90" y2="0"><stop offset="0" stop-color="#0772a3" stop-opacity="0"/><stop offset=".5" stop-color="#0772a3" stop-opacity="0.95"/><stop offset="1" stop-color="#0772a3" stop-opacity="0"/><animateTransform attributeName="gradientTransform" type="translate" values="0 0;1300 0;1300 0" keyTimes="0;.4;1" dur="8.0s" begin="2.8s" repeatCount="indefinite"/></linearGradient></defs>
